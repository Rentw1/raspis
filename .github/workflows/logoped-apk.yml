name: Логопед-конструктор APK

on:
  push:
    paths:
      - 'logoped-apk/**'
      - '.github/workflows/logoped-apk.yml'
  pull_request:
    paths:
      - 'logoped-apk/**'
      - '.github/workflows/logoped-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: logoped-apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Проверка словаря и картинок
        run: node tools/prepare_assets.js --check

      - name: Самопроверка заданий и конспектов
        run: node tools/selftest.js

      - name: Сборка APK
        run: ./build.sh

      - name: Проверка подписи
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --verbose dist/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Logoped-Konstruktor-apk
          path: logoped-apk/dist/*.apk
          if-no-files-found: error
