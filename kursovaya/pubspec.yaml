name: kursovaya
description: "Курсовая ЛТЭТ — генератор курсовых работ по регламенту ГАПОУ «Лаишевский технико-экономический техникум»"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  pdf: ^3.13.1
  printing: ^5.15.1
  archive: ^4.3.0
  file_picker: ^13.1.0
  wakelock_plus: ^1.8.0
  html: ^0.15.7
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/LiberationSerif-Regular.ttf
    - assets/fonts/LiberationSerif-Bold.ttf
    - assets/fonts/LiberationSerif-Italic.ttf
    - assets/fonts/LiberationSerif-BoldItalic.ttf
    - assets/fonts/OFL.txt
